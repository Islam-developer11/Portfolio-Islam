<main>
  <!-- Hero Section -->
  <section id="home" class="relative bg-portfolio-bg pt-32 pb-16 overflow-hidden">
    <div class="max-w-7xl mx-auto min-h-[calc(100vh-6rem)] px-6 lg:px-10 flex items-center">
      <div class="w-full grid grid-cols-1 lg:grid-cols-2 gap-10 lg:gap-4 items-center">
        <!-- ================= LEFT : TEXT ================= -->
        <div class="relative z-10 py-12 lg:py-0">
          <!-- Small intro -->
          <div class="flex items-center gap-3 mb-6 text-portfolio-primary font-medium">
            <span class="h-px w-10 bg-portfolio-primary"></span>

            <span class="tracking-wide"> Welcome to my portfolio </span>
          </div>

          <!-- Main Heading -->
          <div class="mb-4">
            @if (isAvailableForWork) {
              <span
                class="inline-block px-4 py-1.5 rounded-full bg-portfolio-primary text-white text-sm font-medium shadow-md"
              >
                Available for new challenges 🚀
              </span>
            } @else {
              <span
                class="inline-block px-4 py-1.5 rounded-full bg-amber-600 text-white text-sm font-medium shadow-md"
              >
                Building cool stuff behind the scenes 💻⏳
              </span>
            }
          </div>

          <h1
            class="text-5xl sm:text-6xl lg:text-7xl font-bold leading-[1.05] tracking-tight text-portfolio-text"
          >
            Hi, I'm
            <span class="text-portfolio-primary">
              {{ name }}
            </span>
            <span class="block mt-2">
              {{ title }}
            </span>
          </h1>

          <!-- Description -->
          <p class="mt-7 max-w-xl text-lg leading-8 text-portfolio-muted">
            {{ description }}
          </p>

          <!-- Buttons -->
          <div class="mt-9 flex flex-wrap items-center gap-4">
            <!-- Primary -->
            <a
              href="#projects"
              class="inline-flex items-center gap-2 rounded-full bg-portfolio-primary px-6 py-3 font-semibold text-white shadow-sm transition-all duration-300 hover:-translate-y-1 hover:bg-portfolio-primary-dark hover:shadow-lg"
            >
              View My Projects

              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.8"
                stroke="currentColor"
                class="size-5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M17.25 8.25 21 12m0 0-3.75 3.75M21 12H3"
                />
              </svg>
            </a>

            <!-- Secondary -->
            <a
              href="#contact"
              class="inline-flex items-center rounded-full border border-portfolio-primary px-6 py-3 font-semibold text-portfolio-primary transition-all duration-300 hover:bg-portfolio-primary hover:text-white"
            >
              Contact Me
            </a>
          </div>

          <!-- Small tech line -->
          <div class="mt-10 flex items-center gap-4 text-sm text-portfolio-muted">
            <span>Angular</span>
            <span class="size-1 rounded-full bg-portfolio-primary"></span>

            <span>Tailwind</span>
            <span class="size-1 rounded-full bg-portfolio-primary"></span>

            <span>.NET</span>
          </div>
        </div>

        <!-- ================= RIGHT : IMAGE ================= -->
        <div class="relative flex justify-center lg:justify-end items-center">
          <!-- Character Image -->
          <img
            [src]="avatarUrl"
            alt="Islam - Software Engineer"
            class="relative z-10 w-full max-w-[520px] object-contain drop-shadow-xl transition-transform duration-500 hover:-translate-y-2"
          />
        </div>
      </div>
    </div>
  </section>
</main>
