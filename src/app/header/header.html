<header
  class="fixed top-0 left-0 z-50 w-full bg-portfolio-bg/95 backdrop-blur-md border-b border-hijab/40 shadow-sm"
>
  <div class="max-w-7xl mx-auto flex items-center justify-between px-6 py-4">
    <!-- Logo -->
    <a href="#home" class="flex items-center gap-2 text-portfolio-text group">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-6 text-portfolio-primary transition-transform duration-300 group-hover:rotate-6"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="m17.25 6.75 5.25 5.25-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3-4.5 16.5"
        />
      </svg>
      <span class="text-xl font-semibold tracking-wide">Islam</span>
    </a>

    <!-- Desktop Navigation -->
    <nav class="hidden md:flex items-center gap-8 font-medium text-portfolio-text">
      <a href="#home" class="hover:text-portfolio-primary transition-colors">Home</a>
      <a href="#about" class="hover:text-portfolio-primary transition-colors">About</a>
      <a href="#projects" class="hover:text-portfolio-primary transition-colors">Projects</a>
      <a href="#contact" class="hover:text-portfolio-primary transition-colors">Contact</a>
    </nav>

    <!-- Desktop Resume Button (مخفي على الموبايل عشان ما يحشر الشاشة) -->
    <a
      [href]="cvUrl"
      download="Islam_Abu_Khalaf_CV.pdf"
      class="hidden md:inline-flex items-center gap-2 rounded-full border border-portfolio-primary px-5 py-2 font-semibold text-portfolio-primary hover:bg-portfolio-primary hover:text-white transition-all"
    >
      <span>Download CV</span>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.8"
        stroke="currentColor"
        class="size-4"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"
        />
      </svg>
    </a>

    <!-- Mobile Burger Button -->
    <button
      type="button"
      (click)="toggleMenu()"
      class="md:hidden p-2 text-portfolio-text hover:text-portfolio-primary focus:outline-none"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.8"
        stroke="currentColor"
        class="size-7"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
  </div>

  <!-- Mobile Dropdown Menu (مرتبة بشكل انسيابي ومريح للعين) -->
  <div
    [class.hidden]="!isMenuOpen"
    class="md:hidden bg-portfolio-bg/98 border-b border-hijab/40 px-8 py-6 flex flex-col gap-4 shadow-xl"
  >
    <a
      href="#home"
      (click)="closeMenu()"
      class="text-lg font-medium text-portfolio-text hover:text-portfolio-primary transition-colors"
      >Home</a
    >
    <a
      href="#about"
      (click)="closeMenu()"
      class="text-lg font-medium text-portfolio-text hover:text-portfolio-primary transition-colors"
      >About</a
    >
    <a
      href="#projects"
      (click)="closeMenu()"
      class="text-lg font-medium text-portfolio-text hover:text-portfolio-primary transition-colors"
      >Projects</a
    >
    <a
      href="#contact"
      (click)="closeMenu()"
      class="text-lg font-medium text-portfolio-text hover:text-portfolio-primary transition-colors"
      >Contact</a
    >

    <hr class="border-hijab/30 my-1" />

    <!-- زر Download CV جوا المنيو للموبايل -->
    <a
      [href]="cvUrl"
      download="Islam_Abu_Khalaf_CV.pdf"
      (click)="closeMenu()"
      class="inline-flex items-center justify-center gap-2 rounded-full border border-portfolio-primary px-5 py-2.5 font-semibold text-portfolio-primary hover:bg-portfolio-primary hover:text-white transition-all text-center"
    >
      <span>Download CV</span>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.8"
        stroke="currentColor"
        class="size-4"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"
        />
      </svg>
    </a>
  </div>
</header>
